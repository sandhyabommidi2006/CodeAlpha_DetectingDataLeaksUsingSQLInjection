<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CloudRide | Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg p-4">

<h2 class="text-center mb-4">
Payment
</h2>

<hr>

<p>
<strong>Bus :</strong>
{{ bus.bus_name }}
</p>

<p>
<strong>Route :</strong>
{{ bus.source }} → {{ bus.destination }}
</p>

<p>
<strong>Seat :</strong>
{{ seat_number }}
</p>

<p>
<strong>Fare :</strong>
₹{{ bus.fare }}
</p>

<hr>

<form action="{{ url_for('confirm_booking') }}" method="POST">

<input
type="hidden"
name="bus_id"
value="{{ bus.id }}">

<input
type="hidden"
name="seat_number"
value="{{ seat_number }}">

<div class="mb-3">

<label class="form-label">
Card Holder Name
</label>

<input
type="text"
class="form-control"
placeholder="Enter Name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Card Number
</label>

<input
type="text"
class="form-control"
maxlength="16"
placeholder="1234 5678 9012 3456"
required>

</div>

<div class="row">

<div class="col">

<label class="form-label">
Expiry
</label>

<input
type="text"
class="form-control"
placeholder="MM/YY"
required>

</div>

<div class="col">

<label class="form-label">
CVV
</label>

<input
type="password"
class="form-control"
maxlength="3"
required>

</div>

</div>

<br>

<button
type="submit"
class="btn btn-success w-100">

Pay ₹{{ bus.fare }}

</button>

</form>

<br>

<a
href="{{ url_for('seats', bus_id=bus.id) }}"
class="btn btn-secondary w-100">

Back

</a>

</div>

</div>

</div>

</div>

</body>

</html>
