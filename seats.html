<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CloudRide | Select Seat</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

.driver{
background:#343a40;
color:white;
padding:12px;
width:180px;
margin:auto;
text-align:center;
border-radius:10px;
margin-bottom:30px;
font-weight:bold;
}

.seat-grid{
display:grid;
grid-template-columns:repeat(4,70px);
gap:20px;
justify-content:center;
}

.seat-btn{
width:65px;
height:65px;
border:none;
border-radius:10px;
font-weight:bold;
text-decoration:none;
display:flex;
align-items:center;
justify-content:center;
}

.available{
background:#28a745;
color:white;
}

.available:hover{
background:#218838;
color:white;
}

.booked{
background:#dc3545;
color:white;
cursor:not-allowed;
}

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center">
{{ bus.bus_name }}
</h2>

<p class="text-center">
{{ bus.source }} → {{ bus.destination }}
</p>

<div class="driver">
🚌 DRIVER
</div>

<div class="seat-grid">

{% for seat in seats %}

{% if seat.status == "Available" %}

<a
href="{{ url_for('book', bus_id=bus.id, seat_number=seat.seat_number) }}"
class="seat-btn available">

{{ seat.seat_number }}

</a>

{% else %}

<button
class="seat-btn booked"
disabled>

{{ seat.seat_number }}

</button>

{% endif %}

{% endfor %}

</div>

<br>

<a href="/booking" class="btn btn-secondary">
Back
</a>

</div>

</body>
</html>
